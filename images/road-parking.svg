<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Тротуар -->
  <path d="M 0 25 L 20 25 L 20 10 L 90 10 L 90 90 L 20 90 L 20 75 L 0 75 Z" fill="#C0C0C0"/>
  
  <!-- Дорога и парковка -->
  <path d="M 0 30 L 20 30 L 20 15 L 85 15 L 85 85 L 20 85 L 20 70 L 0 70 Z" fill="#808080"/>
  
  <!-- Бордюры -->
  <path d="M 0 25 L 20 25 L 20 10 L 90 10 L 90 15 L 20 15 L 20 30 L 0 30 Z" fill="#A0A0A0"/>
  <path d="M 0 70 L 20 70 L 20 85 L 85 85 L 85 90 L 20 90 L 20 75 L 0 75 Z" fill="#A0A0A0"/>
  <path d="M 85 15 L 90 15 L 90 90 L 85 90 Z" fill="#A0A0A0"/>
  
  <!-- Разметка -->
  <!-- Центральная линия дороги -->
  <line x1="0" y1="50" x2="20" y2="50" stroke="white" stroke-width="3" stroke-dasharray="10,10"/>
  
  <!-- Разметка парковочных мест (4 места сверху вниз) -->
  <line x1="25" y1="15" x2="25" y2="85" stroke="white" stroke-width="2"/>
  <line x1="45" y1="15" x2="45" y2="85" stroke="white" stroke-width="2"/>
  <line x1="65" y1="15" x2="65" y2="85" stroke="white" stroke-width="2"/>
  
  <!-- Горизонтальная разметка -->
  <line x1="25" y1="32" x2="85" y2="32" stroke="white" stroke-width="2"/>
  <line x1="25" y1="50" x2="85" y2="50" stroke="white" stroke-width="2"/>
  <line x1="25" y1="68" x2="85" y2="68" stroke="white" stroke-width="2"/>
  
  <!-- Пешеходный переход -->
  <g stroke="white" stroke-width="3">
    <line x1="5" y1="35" x2="15" y2="35"/>
    <line x1="5" y1="45" x2="15" y2="45"/>
    <line x1="5" y1="55" x2="15" y2="55"/>
    <line x1="5" y1="65" x2="15" y2="65"/>
  </g>
</svg>
